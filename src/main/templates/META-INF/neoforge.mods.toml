modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Vortianski and community compatibility patches"
description='''Keeps Weavers Paradise cosplay armor visible in Epic Fight, including first-person combat rendering.'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="weaversparadise"
type="required"
versionRange="[1.6.3,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="epicfight"
type="required"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
