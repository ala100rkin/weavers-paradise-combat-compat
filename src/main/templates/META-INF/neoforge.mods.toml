modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Vortianski and community compatibility patches"
description='''Client-side combat compatibility for Weavers Paradise cosplay rendering with Epic Fight, Iron's Spells 'n Spellbooks, and Better Lock On. These integrations are optional.'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="weaversparadise"
type="required"
versionRange="[1.6.3,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="epicfight"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="betterlockon"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="irons_spellbooks"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
